
name: Build KYNORA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      
 
      - name: Extract starter ZIP
        run: |
          echo "Checking Premium ZIP..."
          ls -lh *.zip
          if [ -f KYNORA_Premium_UI_Starter.zip ]; then
            echo "Extracting PREMIUM UI"
            unzip -o KYNORA_Premium_UI_Starter.zip -d .
          else
            echo "ERROR: Premium ZIP not found"
            exit 1
          fi
 

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kynora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
